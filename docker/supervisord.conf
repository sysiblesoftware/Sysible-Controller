; Sysible Controller — process definitions (included by Debian's
; /etc/supervisor/supervisord.conf, which provides [supervisord],
; [unix_http_server], and [supervisorctl] so `supervisorctl restart backend`
; works from inside the container — used by the console's cert-regen / restart).
;
; Both services inherit the environment the entrypoint exports before exec'ing
; supervisord (the /data paths, the cookie secret, TLS flags), so we only set
; here what is process-specific. Logs go to the container's stdout/stderr so
; `docker logs` shows them.

[program:backend]
; The controller API on :9000 — agents enroll/poll here and the CLI/console call
; it. TLS uses the self-signed cert the entrypoint provisions on /data.
command=uvicorn backend.app:app --host 0.0.0.0 --port %(ENV_SYSIBLE_BACKEND_PORT)s
    --ssl-keyfile %(ENV_SYSIBLE_CERT_DIR)s/server.key
    --ssl-certfile %(ENV_SYSIBLE_CERT_DIR)s/server.crt
    --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webgui]
; The React web console BFF on :8800. Serves the SPA and proxies admin actions
; to the backend (via client/api.py -> SYSIBLE_API_URL). Starts after the
; backend (lower priority number = earlier); autorestart keeps it up if it dies.
command=uvicorn webgui.server:app --host 0.0.0.0 --port %(ENV_SYSIBLE_WEBGUI_PORT)s
    --ssl-keyfile %(ENV_SYSIBLE_CERT_DIR)s/server.key
    --ssl-certfile %(ENV_SYSIBLE_CERT_DIR)s/server.crt
    --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
