; Sysible Controller — supervisord main config (non-root).
;
; This is the FULL supervisord config (installed at /etc/supervisor/supervisord.conf),
; not just an include: the container runs as a non-root user (uid 10001), so the
; socket / pidfile / logfile must live on the writable /data volume rather than the
; root-owned /var/run + /var/log the Debian default uses. supervisorctl (used by the
; console's cert-regen / "restart backend" flow and the in-container CLI) reads this
; same file, so `supervisorctl restart backend` finds the socket below.
;
; The two services inherit the environment the entrypoint exports before exec'ing
; supervisord (the /data paths, the cookie secret, TLS flags). Logs go to the
; container's stdout/stderr so `docker logs` shows them.

[unix_http_server]
file=/data/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/data/run/supervisord.log
pidfile=/data/run/supervisord.pid
loglevel=info
; Run children as the current (non-root) user — no user= switch.

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/run/supervisor.sock

[program:backend]
; The controller API on :9000 — agents enroll/poll here and the CLI/console call
; it. TLS uses the self-signed cert the entrypoint provisions on /data.
command=uvicorn backend.app:app --host 0.0.0.0 --port %(ENV_SYSIBLE_BACKEND_PORT)s
    --ssl-keyfile %(ENV_SYSIBLE_CERT_DIR)s/server.key
    --ssl-certfile %(ENV_SYSIBLE_CERT_DIR)s/server.crt
    --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webgui]
; The React web console BFF on :8800. Serves the SPA and proxies admin actions
; to the backend (via client/api.py -> SYSIBLE_API_URL). Starts after the
; backend (lower priority number = earlier); autorestart keeps it up if it dies.
command=uvicorn webgui.server:app --host 0.0.0.0 --port %(ENV_SYSIBLE_WEBGUI_PORT)s
    --ssl-keyfile %(ENV_SYSIBLE_CERT_DIR)s/server.key
    --ssl-certfile %(ENV_SYSIBLE_CERT_DIR)s/server.crt
    --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
