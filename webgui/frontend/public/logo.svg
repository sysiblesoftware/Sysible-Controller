<?xml version="1.0" encoding="UTF-8"?>
<!-- Sysible Controller mark — the canonical spoked topology from the website:
     a dark rounded tile + brand-green ring, a central GREEN hub wired out to six
     satellite nodes (alternating white / brand-blue) by thin grey connectors.
     No hexagon. Mirrors src/Logo.jsx. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d29"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#tg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" ry="25.5"
        fill="none" stroke="#6ddb73" stroke-width="4"/>
  <g stroke="#8aa0c8" stroke-width="2.7" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="64" x2="100" y2="64"/>
    <line x1="64" y1="64" x2="82" y2="95.18"/>
    <line x1="64" y1="64" x2="46" y2="95.18"/>
    <line x1="64" y1="64" x2="28" y2="64"/>
    <line x1="64" y1="64" x2="46" y2="32.82"/>
    <line x1="64" y1="64" x2="82" y2="32.82"/>
  </g>
  <circle cx="100" cy="64" r="6.6" fill="#eceff3"/>
  <circle cx="82" cy="95.18" r="6.6" fill="#7aa2ff"/>
  <circle cx="46" cy="95.18" r="6.6" fill="#eceff3"/>
  <circle cx="28" cy="64" r="6.6" fill="#7aa2ff"/>
  <circle cx="46" cy="32.82" r="6.6" fill="#eceff3"/>
  <circle cx="82" cy="32.82" r="6.6" fill="#7aa2ff"/>
  <circle cx="64" cy="64" r="11" fill="#6ddb73"/>
</svg>
